<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox(플렉스 박스)</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    <style>
        :root {font-size: 10px;}
        body * {outline: 5px dashed red;}
        div {height: 300px; font-size: 50px;}
        div > div {width: 400px; height: 100px;}
    </style>
</head>
<body>
    <!-- 
        선택자 {속성: 값;}
        .d-flex {display:flex;}
        .flex-column {flex-direction: column;}

        float: left|right;
        clear: left|right|both;

        <table>태그 Layout(2차원) -> 비표준
        floating Layout -> flexbox Layout(1차원) -> grid Layout(2차원)
        position: static|relative|absolute|fixed|sticky
        
        박스 모델 속성
            1. display: block|inline|inline-block|none;
            2. width
            3. height
            4. padding
            5. border
            6. margin

        outline: 1px dashed lime;
        
        (기본형)
        border-width: 두께;
        border-style: 스타일;
        border-color: 색;

        (속기형)
        border: 1px dashed lime; -> 속성 값의 순서x
        border: dashed 1px lime;
        border: dashed lime 1px;
        border-top: 1px dashed lime;


        부모(플렉스 컨테이너)
            display:flex;
                1. flex-direction: 배치방향
                    - row(기본값)|column|row-reverse|column-reverse;
                2. flex-wrap: 줄바꿈
                    - wrap|nowrap(기본값)|wrap-reverse
                3. flew-flow: 배치방향 줄바꿈; (속기형)
                    - row nowrap (기본값)

                4. justify-content: 주축 정렬(align)
                    - flex-start|flex-end|center|space-between|space-evenly|space-arround
                5. align-items: 교차축 정렬
                    - flex-start|flex-end|center|baseline|stretch(기본값)
                6. align-content: 교차축 정렬
                    - flex-wrap:wrap;이 적용되어 2줄 이상이 되어야 효과가 있습니다.
                    - flex-start|flex-end|center|space-between|space-arround|stretch(기본값)
                7. gap, row-gap, column-gap 여백
                    - 0 (기본값)
                    - 10px
                
        자식(플렉스 아이템)
                1. align-self: 교차축 정렬
                    flex-start|flex-end|center|baseline|stretch|auto(기본값)
                2. flex-grow: 남는 공간을 얼마나 차지할지
                    - 0: 성장x -> 기본값
                    - 1: 성장
                3. flex-shrink: 공간이 부족할 때 얼마나 줄어들지
                    - 1(기본값) : 줄어듦
                    - 0 : 줄어들지 않음
                4. flex-basis: 기본 크기
                    - flex-basis가 auto이면 width(또는 height) 값을 기준으로 크기가 결정됩니다.
                5. flex: 성장 수축 크기; (속기형)
                    - flex: 1 1 0; 와 flex: 1; 는 같다.
                    -> 모든 아이템이 동일한 비율로 공간을 나눠 가집니다.
                    - flex: 1 1 auto;
                    -> 기본 크기는 유지하면서 남는 공간만 채우기

                    - flex: 1 1 auto; -> flex-fill
                    - flex-grow: 0; -> flex-grow-0
                    - flex-grow: 1; -> flex-grow-1
                    - flex-shrink: 0; -> flex-shrink-0
                    - flex-shrink: 1; -> flex-shrink-1

                6. order: 표시 순서를 변경
                    - 숫자(정수)
    -->
    <!-- flex-direction: row;(기본값) 이면 주축이 가로, 교차축은 세로 -->
    <!-- flex-direction: column; 이면 주축이 세로, 교차축은 가로 -->
    <!-- 
            중단점(breakpoint)
                - sm    576px
                - md    768px
                - lg    992px
                - xl    1200px
                - xxl   1400px
    -->

    <div class="d-flex flex-wrap">
        <div class="order-2 order-xl-0">1</div>
        <div class="order-1">2</div>
        <div class="order-0 order-xl-2">3</div>
    </div>
</body>
</html>
