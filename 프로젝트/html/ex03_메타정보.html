<!DOCTYPE html>
<html lang="en">

<head>
    <!-- 문서의 문자 인코딩을 UTF-8(전 세계 표준)로 설정하여 한글 깨짐을 방지합니다. -->
    <meta charset="UTF-8">

    <!-- 모바일 및 반응형 웹 설정을 위한 태그입니다. (기기 화면 너비에 맞추고 기본 확대 비율을 1.0으로 설정) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 검색엔진(구글, 네이버 등) 검색 결과에 표시될 웹사이트 설명글입니다. -->
    <meta name="description" content="아파트 매물 검색과 실거래 정보를 제공하는 부동산 플랫폼">

    <!-- 검색엔진 크롤러봇에게 이 페이지를 인덱싱(index)하고 페이지 내 링크를 수집(follow)하도록 허용합니다. -->
    <meta name="robots" content="index, follow">

    <!-- 모바일 브라우저(크롬, 사파리 등)의 상단 주소창/상태바 테마 색상을 지정합니다. (여기서는 파란색 계열) -->
    <meta name="theme-color" content="#2563eb">

    <!-- SNS 공유 (Open Graph 메타 태그: 카카오톡, 페이스북, 라인 등에 링크 공유 시 보이는 정보) -->
    <!-- 공유 카드에 표시될 제목 -->
    <meta property="og:title" content="HomePick">

    <!-- 공유 카드에 표시될 상세 설명 내용 -->
    <meta property="og:description" content="스마트한 부동산 검색 서비스">

    <!-- 공유 카드에 함께 노출되는 미리보기 대표 이미지 경로 -->
    <meta property="og:image" content="/images/og-image.png">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <!-- HTML 요소를 모두 기록후 마지막에 스크립트 추가 -->
    <script src="script.js"></script>
</body>
</html>
