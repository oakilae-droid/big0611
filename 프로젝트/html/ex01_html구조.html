<!-- html5 파일의 기본 구조 -->
<!DOCTYPE html>
<!-- 한글: ko, 영어: en, 일본어: ja, 중국어: zh -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HTML: Hyper Text Markup Language -->
    <!-- 하이퍼 텍스트: 웹 페이지 간 이동을 위한 텍스트 -->
    <a href="https://www.naver.com">네이버</a>
    <p>네이버</p>
    <!-- 마크업 언어: 태그를 이용해 문서나 데이터의 구조를 표현하는 언어
        SGML, XML, HTML, XHTML, ...
        HTML: Hyper Text Markup Language
        XML: Extensible Markup Language -> 사용자 정의 태그, 데이터 전송용
        XHTML: Extensible Hyper Text Markup Language -> XML 기반의 HTML
        HTML5: Hyper Text Markup Language 5        
    -->
    <!-- 속성
             - 글로벌 속성: 모든 태그에 사용할 수 있는 속성
             - class, id, style, title, ...
             - 필수 속성
             - 선택 속성
        <시작태그 속성="값">내용</끝태그>
        <시작태그 속성="값">
    -->
</body>
</html>
