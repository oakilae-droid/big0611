<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입력 양식 속성</title>
</head>

<body>
    <!-- 
                        재정의
        action          formaction
        method          formmethod
        enctype         formenctype
        target          formtarget
        novalidate      formnovalidate
    -->

    <!-- 
        form의 id속성과 input의 form속성 값이 일치하면,
        폼 밖의 input도 폼의 요소가 된다.
     -->
    <form action="/action_page.php" id="form1">
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname"><br><br>
        <input type="submit" value="Submit">
    </form>

    <label for="lname">Last name:</label>
    <input type="text" id="lname" name="lname" form="form1">

    <!-- formaction속성은 폼이 제출될 때 입력값을 처리할 파일의 URL을 지정 -->
    <form action="/action_page.php">
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname"><br><br>
        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname"><br><br>
        <input type="submit" value="Submit">
        <input type="submit" formaction="/action_page2.php" value="Submit as Admin">
    </form>

    <!-- formenctype 속성은 폼 데이터가 제출될 때 어떤 방식으로 인코딩되어야 하는지를 지정합니다(메서드가 "post"인 폼에만 해당). -->
    <form action="/action_page_binary.asp" method="post">
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname"><br><br>
        <input type="submit" value="Submit">
        <input type="submit" formenctype="multipart/form-data" value="Submit as Multipart/form-data">
    </form>

    <!-- formmethod 속성은 폼 데이터를 액션 URL로 전송하는 데 사용할 HTTP 메서드 재정의 -->
    <form action="/action_page.php" method="get">
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname"><br><br>
        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname"><br><br>
        <input type="submit" value="Submit using GET">
        <input type="submit" formmethod="post" value="Submit using POST">
    </form>

    <!-- formtarget속성은 폼 제출 후 수신된 응답을 표시할 위치를 나타내는 이름 또는 키워드를 지정 -->
    <form action="/action_page.php">
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname"><br><br>
        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname"><br><br>
        <input type="submit" value="Submit">
        <input type="submit" formtarget="_blank" value="Submit to a new window/tab">
    </form>

    <!-- formnovalidate속성은 `<input>` 요소가 제출될 때 유효성 검사를 수행하지 않도록 지정 -->
    <form action="/action_page.php">
        <label for="email">Enter your email:</label>
        <input type="email" id="email" name="email"><br><br>
        <input type="submit" value="Submit">
        <input type="submit" formnovalidate="formnovalidate" value="Submit without validation">
    </form>

    <!-- novalidate 옵션이 있는 경우, 제출 시 모든 폼 데이터에 대한 유효성 검사를 수행하지 않도록 지정합니다. -->
    <form action="/action_page.php" novalidate>
        <label for="email">Enter your email:</label>
        <input type="email" id="email" name="email"><br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
