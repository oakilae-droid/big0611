<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼요소</title>
</head>

<body>

    <h2>The input Element</h2>

    <form action="/action_page.php">
        <fieldset>
            <legend>필수 개인 정보 입력</legend>
            <label for="uid">아이디</label><br>
            <!-- 영문 대소문자 + 숫자 조합, 4~20자로 제한 -->
            <input type="text" id="uid" name="uid" required pattern="[A-Za-z0-9]{4,20}"
                title="영문 대소문자 + 숫자 조합, 4~20자로 제한"><br><br>
            <label for="upw">패스워드</label><br>
            <!--
                "영문이 최소 1개 있고, 숫자가 최소 1개 있고, 특정 특수문자가 최소 1개 있으며, 전체 문자는 허용된 문자로만 8~20자여야 한다."
            -->
            <input type="password" id="upw" name="upw" required
                pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,20}"><br><br>
            <input type="submit" value="로그인">
        </fieldset>
    </form>


    <label>
        <input type="text" size="3">한 줄 문장(단어)
    </label>

    <input type="submit" value="로그인">
    <!-- type을 생략하면 submit -->
    <button>로그인</button>
    <button type="button" onclick="alert('Hello World!')">Click Me!</button>

    <form action="/action_page.php">
        <textarea name="message" id="message" rows="5" cols="60">여러 줄 문장 기록 시 사용한다. 회칙, 방명록, ...</textarea>
        <br><br>
        <textarea name="message" id="message"
            style="width:407px; height: 78px; resize: none;">여러 줄 문장 기록 시 사용한다. 회칙, 방명록, ...</textarea>
        <br><br>
        <input type="submit">
    </form>

    <!-- 목록상자: 목록 선택만 가능 -->
    <form action="/action_page.php" method="get">
        <label for="cars">Choose a car:</label>
        <select id="cars" name="cars" size="4" multiple>
            <option value="audi">Audi</option>
            <option value="fiat">Fiat</option>
            <option value="saab">Saab</option>
            <option value="volvo" selected>Volvo</option>
        </select>
        <input type="submit">
    </form>

    <label for="subjects">Choose a subject:</label>
    <select name="subjects" id="subjects">
        <optgroup label="국문과">
            <option value="education">국어교육론</option>
            <option value="method">국어교수법</option>
        </optgroup>
        <optgroup label="컴퓨터공학과">
            <option value="programming">프로그래밍</option>
            <option value="algorithms">알고리즘</option>
        </optgroup>
    </select>

    <!-- 콤보상자: 목록 선택 + 입력 -->
    <form action="/action_page.php">
        <input list="browsers" name="browser">
        <datalist id="browsers">
            <option value="Edge">엣지</option>
            <option value="Firefox">파이어폭스</option>
            <option value="Chrome">크롬</option>
            <option value="Opera">오페라</option>
            <option value="Safari">사파리</option>
        </datalist>
        <input type="submit" value="브라우저종류선택">
    </form>


    <input type="text" list="이름">
    <datalist id="이름">
        <optgroup>
            <option>항목1</option>
            <option>항목2</option>
            <option>항목3</option>
        </optgroup>
        <optgroup>
            <option>항목4</option>
            <option>항목5</option>
        </optgroup>
    </datalist>

    <fieldset>
        <legend></legend>
    </fieldset>

    <form action="/action_page.php" oninput="x.value=parseInt(a.value)+parseInt(b.value)">
        0
        <input type="range" id="a" name="a" value="50">
        100 +
        <input type="number" id="b" name="b" value="50">
        =
        <output name="x" for="a b"></output>
        <br><br>
        <input type="submit">
    </form>
</body>

</html>
